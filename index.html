<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05040b">
<title>De Pablo para Yasmin</title>
<style>
:root{--pink:#e7b4ff;--blue:#a9c8ff;--glow:#cda6ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05040b;color:#f8edff}
body{min-height:100svh;display:grid;place-items:center;overflow:hidden;font-family:Georgia,'Times New Roman',serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 63%,#21132f 0%,#0d0a18 38%,#05040b 76%);pointer-events:none}
.stars{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#f4ddff;box-shadow:0 0 8px 2px #c8a1ff88;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:.9;transform:scale(1.5)}}
main{position:relative;z-index:1;width:min(100%,620px);min-height:100svh;padding:clamp(30px,7vh,68px) 18px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.topline{font:10px/1.5 Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#c8afd9;opacity:0;animation:fade .9s ease 0.3s forwards}
h1{font-size:clamp(26px,7vw,42px);font-weight:400;letter-spacing:.025em;margin:12px 0 0;color:#f7eaff;text-shadow:0 0 24px #c99aff55;opacity:0;animation:fade 1.4s ease .7s forwards}
h1 span{font-style:italic;color:#e5c1ff}
.stage{width:min(100%,490px);height:clamp(350px,58vh,510px);position:relative;margin:5px auto 0}
svg{width:100%;height:100%;overflow:visible}
.draw{fill:none;stroke:#d9c4f2;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #b99be8)}
.detail{fill:none;stroke:#e5d5f7;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:0;filter:drop-shadow(0 0 4px #c8a5f5);animation:appear 1.8s ease 5.7s forwards}
.detail-soft{fill:none;stroke:#9c8acb;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:appear 1.8s ease 5.9s forwards}
.trace{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 4.7s ease-in-out .5s forwards}
.trace.delay{animation-delay:1.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.silhouette{opacity:0;filter:drop-shadow(0 0 17px #b38bff66);animation:appear 1.8s ease 5.1s forwards}
@keyframes appear{0%{opacity:0}100%{opacity:1}}
.rose-line{fill:none;stroke:#e7b9ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:350;stroke-dashoffset:350;filter:drop-shadow(0 0 7px #d5a4ff);animation:draw 2s ease 4.4s forwards}
.rose-glow{opacity:0;animation:appear 1.2s ease 6.2s forwards}
.quote{max-width:390px;margin:-4px auto 0;font-size:clamp(17px,4.5vw,22px);line-height:1.55;font-style:italic;color:#ead8f8;opacity:0;transform:translateY(10px);animation:quoteIn 1.5s ease 7s forwards;text-shadow:0 0 18px #cba2ff55}
.quote small{display:block;margin-top:13px;font:10px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#bba6ce}
@keyframes quoteIn{to{opacity:1;transform:translateY(0)}}
.bottom{margin-top:25px;color:#8f7d9f;font:9px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;animation:fade 1s ease 8s forwards}
@keyframes fade{to{opacity:1}}
@media(max-height:650px){main{padding-top:18px;padding-bottom:14px}.stage{height:45vh;min-height:280px}.bottom{margin-top:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="stars" aria-hidden="true">
